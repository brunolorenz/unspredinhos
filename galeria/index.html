<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predinho do Dia — Galeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE7D6;
    --paper-2: #E7DCC5;
    --ink: #26221D;
    --ink-soft: #55503F;
    --terracotta: #A8502E;
    --azulejo: #2F5D73;
    --verde: #5C7A4E;
    --ouro: #B98A2E;
    --line: rgba(38,34,29,0.14);
    --radius: 10px;
    --shadow: 0 10px 24px -12px rgba(38,34,29,0.35);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(168,80,46,0.06), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(47,93,115,0.06), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  a{color:inherit;}

  /* ---------- Header ---------- */
  header.hero{
    padding:56px 20px 28px;
    max-width:960px;
    margin:0 auto;
    text-align:center;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--terracotta);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    width:22px; height:1px; background:var(--terracotta); opacity:0.5;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(2.4rem, 6vw, 4rem);
    margin:14px 0 10px;
    line-height:1.02;
  }
  .lede{
    font-size:15.5px;
    color:var(--ink-soft);
    max-width:560px;
    margin:0 auto;
    line-height:1.55;
  }

  /* ---------- Controls ---------- */
  .controls{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(var(--paper) 78%, transparent);
    padding:14px 16px 10px;
    backdrop-filter:blur(2px);
  }
  .controls-inner{
    max-width:1100px; margin:0 auto;
    display:flex; flex-direction:column; gap:12px;
  }
  .months{
    display:flex; gap:6px; overflow-x:auto;
    padding:4px 2px 8px;
    scrollbar-width:thin;
  }
  .months::-webkit-scrollbar{height:5px;}
  .months::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .month-btn{
    flex:0 0 auto;
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.35);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .18s ease;
    white-space:nowrap;
  }
  .month-btn:hover{border-color:var(--terracotta); color:var(--terracotta);}
  .month-btn.active{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap{
    position:relative; flex:1 1 240px; min-width:200px;
  }
  .search-wrap input{
    width:100%;
    font-family:'Inter';
    font-size:14px;
    padding:10px 14px 10px 34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.55);
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--azulejo);}
  .search-wrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    opacity:0.5; width:15px; height:15px;
  }
  .btn-ghost{
    font-family:'Space Mono', monospace;
    font-size:12px;
    text-transform:uppercase; letter-spacing:0.04em;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn-ghost:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .status-line{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.75;
    padding-left:2px;
  }

  /* ---------- Grid ---------- */
  main{max-width:1100px; margin:0 auto; padding:8px 16px 60px;}
  .month-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:22px 4px 16px;
    display:flex; align-items:baseline; gap:10px;
  }
  .month-section{
    padding-top:18px;
    border-top:1px dashed var(--line);
  }
  .month-section:first-of-type{
    border-top:none;
    padding-top:0;
  }
  .month-title small{
    font-family:'Space Mono', monospace;
    font-size:12px; font-weight:400;
    color:var(--ink-soft); text-transform:uppercase;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:22px 16px;
  }

  /* ---------- Real weekday-aligned calendar ---------- */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
    margin:0 0 8px;
  }
  .weekday-row span{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    opacity:0.65;
    text-align:center;
  }
  .calendar{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
  }
  .cal-empty{ visibility:hidden; }
  .search-hide{ display:none !important; }
  .cal-blank{
    aspect-ratio:3/4;
    border-radius:var(--radius);
    border:1px dashed var(--line);
    display:flex; align-items:flex-start; justify-content:flex-end;
    padding:6px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.35;
  }
  @media (max-width: 640px){
    .calendar, .weekday-row{ gap:6px; }
    .stamp{ width:24px; height:24px; font-size:10.5px; top:5px; right:5px; }
  }

  /* Mobile: drop the weekday-aligned calendar, show a plain photo grid */
  @media (max-width: 720px){
    .weekday-row{ display:none; }
    .cal-empty, .cal-blank{ display:none; }
    .calendar{
      grid-template-columns:repeat(auto-fill, minmax(108px, 1fr));
      gap:10px;
    }
    .month-title{ margin:18px 4px 10px; font-size:1.25rem; }
  }

  .leaf{
    aspect-ratio:3/4;
    perspective:1200px;
    position:relative;
  }
  .leaf::before{
    /* stacked-paper shadow, like leaves behind the current one */
    content:'';
    position:absolute; inset:6px -4px -8px 4px;
    background:var(--paper-2);
    border-radius:var(--radius);
    transform:rotate(2.2deg);
    z-index:0;
    box-shadow:0 6px 14px -8px rgba(38,34,29,0.4);
  }
  .leaf-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
    z-index:1;
  }
  .leaf.flipped .leaf-inner{ transform:rotateY(180deg); }

  .leaf-face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    border:1px solid rgba(38,34,29,0.08);
  }
  .leaf-front{ background:#ddd3ba; }
  .leaf-front img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .5s ease;
  }
  .leaf:hover .leaf-front img{ transform:scale(1.045); }
  .leaf-front .imgfallback{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft); font-size:11px; text-align:center; padding:10px;
    font-family:'Space Mono',monospace;
  }
  .leaf-mask{
    position:absolute; left:0; right:0; bottom:0;
    height:23%;
    background:var(--paper);
    border-radius:0 0 var(--radius) var(--radius);
  }
  .stamp{
    position:absolute; top:8px; right:8px;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    font-weight:700; font-size:13px;
    transform:rotate(-6deg);
    box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  .leaf.is-today .stamp{ background:var(--terracotta); }
  .today-flag{
    position:absolute; top:8px; left:8px;
    background:var(--ouro); color:#241C0C;
    font-family:'Space Mono', monospace;
    font-size:9.5px; font-weight:700; letter-spacing:0.05em;
    padding:3px 6px; border-radius:4px;
    transform:rotate(-4deg);
  }
  .zoom-btn{
    position:absolute; bottom:8px; right:8px;
    width:26px; height:26px; border-radius:50%;
    background:rgba(20,17,13,0.55);
    border:none; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s ease;
  }
  .leaf:hover .zoom-btn, .leaf:focus-within .zoom-btn{ opacity:1; }
  .zoom-btn svg{ width:13px; height:13px; }

  .leaf-back{
    background:var(--ink);
    color:var(--paper);
    transform:rotateY(180deg);
    display:flex; flex-direction:column;
    padding:16px 14px 12px;
  }
  .leaf-back .region-tag{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 7px; border-radius:4px;
    margin-bottom:10px;
  }
  .leaf-back .rua{
    font-family:'Fraunces', serif;
    font-style:italic; font-weight:600;
    font-size:16px; line-height:1.2;
    margin:0 0 8px;
  }
  .leaf-back .cidade{
    font-size:12.5px; color:#D8CFB9;
    margin-bottom:auto;
  }
  .leaf-back .cidade b{ color:var(--paper); font-weight:600; }
  .leaf-back .nota{
    font-size:11px; color:#C8BEA5; line-height:1.4;
    border-top:1px dashed rgba(239,231,214,0.25);
    padding-top:8px; margin-top:8px;
  }
  .leaf-back .back-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:10px;
  }
  .leaf-back .data-mono{
    font-family:'Space Mono', monospace; font-size:11px; opacity:0.7;
  }
  .leaf-back .ampliar{
    font-family:'Space Mono', monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.03em;
    color:var(--paper); text-decoration:underline;
    background:none; border:none; cursor:pointer; padding:0;
  }

  .region-Sul{ background:#2F5D73; }
  .region-Sudeste{ background:#5C7A4E; }
  .region-Nordeste{ background:#A8502E; }
  .region-Norte{ background:#B98A2E; color:#241C0C; }
  .region-CentroOeste{ background:#7A5C8A; }

  .empty-state, .load-state, .error-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .load-state .spin{
    width:26px; height:26px; margin:0 auto 14px;
    border:2.5px solid var(--line); border-top-color:var(--terracotta);
    border-radius:50%; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-state code{
    display:block; margin-top:12px; font-size:11px;
    background:rgba(38,34,29,0.06); padding:10px; border-radius:6px;
    word-break:break-all;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(20,17,13,0.88);
    display:none; align-items:center; justify-content:center;
    padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-card{
    max-width:720px; width:100%;
    background:var(--paper);
    border-radius:12px;
    overflow:hidden;
    max-height:90vh; overflow-y:auto;
  }
  .lightbox-card img{ width:100%; display:block; }
  .lightbox-info{ padding:18px 22px 22px; }
  .lightbox-info .rua{
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:22px; margin:0 0 6px;
  }
  .lightbox-info .cidade{ font-size:13.5px; color:var(--ink-soft); margin-bottom:10px; }
  .lightbox-info .nota{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .lightbox-close{
    position:fixed; top:22px; right:24px;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);
    color:#fff; cursor:pointer; font-size:18px;
  }

  /* ---------- Footer ---------- */
  footer{
    max-width:960px; margin:20px auto 0; padding:34px 20px 60px;
    text-align:center; border-top:1px dashed var(--line);
  }
  footer .credit{
    font-family:'Space Mono', monospace;
    font-size:12px; color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  footer .credit a{ color:var(--terracotta); text-decoration:none; border-bottom:1px solid currentColor; }
  footer .mark{
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:18px; margin-bottom:8px;
  }
</style>
</head>
<body>

<header class="hero">
  <span class="eyebrow">um prédio por dia</span>
  <h1>Predinho do Dia</h1>
  <p class="lede">A cada dia do ano, uma aquarela de um prédio numa rua batizada com aquela data. Esta é a folhinha completa — clique num dia para virar a página e ver onde ele fica.</p>
</header>

<div class="controls">
  <div class="controls-inner">
    <nav class="months" id="months" aria-label="Selecionar mês"></nav>
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Buscar por rua, cidade ou UF…">
      </div>
    </div>
    <div class="status-line" id="statusLine"></div>
  </div>
</div>

<main id="main">
  <div class="load-state" id="loadState">
    <div class="spin"></div>
    Carregando a planilha…
  </div>
</main>

<footer>
  <div class="mark">Predinho do Dia</div>
  <div class="credit">Projeto Predinho do Dia, por Bruno Lorenz (<a href="https://instagram.com/unspredinhos" target="_blank" rel="noopener">@unspredinhos</a>)</div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">✕</button>
  <div class="lightbox-card">
    <img id="lightboxImg" alt="">
    <div class="lightbox-info">
      <div class="rua" id="lightboxRua"></div>
      <div class="cidade" id="lightboxCidade"></div>
      <div class="nota" id="lightboxNota"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const SHEET_ID = '1BPJ37xzZDbycJ10Pd_9_YqiX_GMIVPMqhcmSd0l1bxI';
  const CANDIDATE_URLS = [
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv',
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv',
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&gid=0',
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Predinhos%202026',
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=predinhos_2026'
  ];

  const MESES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const YEAR = 2026;

  function isValidCalendarDate(dia, mes){
    const dt = new Date(YEAR, mes - 1, dia);
    return dt.getFullYear() === YEAR && dt.getMonth() === mes - 1 && dt.getDate() === dia;
  }
  function daysInMonth(mes){
    return new Date(YEAR, mes, 0).getDate();
  }
  function weekdayOf(dia, mes){
    return new Date(YEAR, mes - 1, dia).getDay();
  }

  const monthsNav = document.getElementById('months');
  const main = document.getElementById('main');
  const statusLine = document.getElementById('statusLine');
  const searchInput = document.getElementById('search');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxRua = document.getElementById('lightboxRua');
  const lightboxCidade = document.getElementById('lightboxCidade');
  const lightboxNota = document.getElementById('lightboxNota');
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeLightbox(); });

  let DATA = [];
  const today = new Date();
  const todayDay = today.getDate();
  const todayMonth = today.getMonth() + 1;

  function parseCSV(str){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i=0;i<str.length;i++){
      const c = str[i];
      if(inQuotes){
        if(c === '"'){
          if(str[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function regionClass(regiao){
    return 'region-' + (regiao || '').replace(/\s+/g,'');
  }

  function imgUrl(base, w){
    if(!base) return '';
    const clean = base.trim().replace(/=.*$/, '');
    return clean + '=w' + w;
  }

  async function fetchCSV(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ao buscar ' + url);
    return res.text();
  }

  function looksLikeOurSheet(text){
    const firstLine = (text.split('\n')[0] || '').toLowerCase();
    return firstLine.includes('dia') && firstLine.includes('rua');
  }

  async function loadData(){
    if(location.protocol === 'file:'){
      showError(new Error('Esta página foi aberta como arquivo local (file://). Sirva-a por http — GitHub Pages, "npx serve", etc. — senão o navegador bloqueia a leitura da planilha.'));
      return;
    }
    try{
      let best = null; // { text, url, rowCount }
      let lastErr = null;
      for(const url of CANDIDATE_URLS){
        try{
          const candidate = await fetchCSV(url);
          if(!looksLikeOurSheet(candidate)){
            lastErr = new Error('Resposta de ' + url + ' não parece ter as colunas esperadas (Dia/Rua).');
            continue;
          }
          const rowCount = candidate.split('\n').filter(l => l.trim() !== '').length;
          if(!best || rowCount > best.rowCount){
            best = { text: candidate, url, rowCount };
          }
        } catch(e){
          lastErr = e;
        }
      }
      if(!best) throw lastErr || new Error('Nenhuma das URLs testadas funcionou.');
      console.log('[Predinho do Dia] fonte usada:', best.url, '—', best.rowCount, 'linhas');
      const text = best.text;
      const rows = parseCSV(text);
      const body = rows.slice(1).filter(r => r[0] && r[0].trim() !== '');
      DATA = body.map(r => ({
        dia: parseInt(r[0], 10),
        mes: parseInt(r[1], 10),
        dataStr: (r[2]||'').trim(),
        rua: (r[3]||'').trim(),
        cidade: (r[4]||'').trim(),
        uf: (r[5]||'').trim(),
        regiao: (r[6]||'').trim(),
        lat: (r[7]||'').trim(),
        lng: (r[8]||'').trim(),
        img: (r[9]||'').trim(),
        nota: (r[10]||'').trim()
      })).filter(d => !isNaN(d.dia) && !isNaN(d.mes) && isValidCalendarDate(d.dia, d.mes));

      if(!DATA.length) throw new Error('Planilha carregada, mas sem linhas de dados reconhecíveis.');


      buildMonthNav();
      renderGallery();
    } catch(err){
      showError(err);
    }
  }

  function buildMonthNav(){
    const present = Array.from(new Set(DATA.map(d => d.mes))).sort((a,b)=>a-b);
    monthsNav.innerHTML = '';
    present.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'month-btn';
      btn.textContent = MESES[m];
      btn.dataset.month = m;
      btn.addEventListener('click', () => {
        const section = document.getElementById('mes-' + m);
        if(section) section.scrollIntoView({behavior:'smooth', block:'start'});
      });
      monthsNav.appendChild(btn);
    });
  }

  function cardHTML(d){
    const isToday = d.dia === todayDay && d.mes === todayMonth;
    const searchBlob = (d.rua + ' ' + d.cidade + ' ' + d.uf).toLowerCase();
    return (
      '<div class="leaf' + (isToday ? ' is-today' : '') + '" data-dia="'+d.dia+'" data-mes="'+d.mes+'" data-search="'+escapeHtml(searchBlob)+'">' +
        '<div class="leaf-inner">' +
          '<div class="leaf-face leaf-front">' +
            (d.img ? '<img src="'+imgUrl(d.img,480)+'" alt="Predinho de '+escapeHtml(d.rua)+'" loading="lazy">' : '<div class="imgfallback">sem imagem</div>') +
            '<div class="leaf-mask"></div>' +
            (isToday ? '<span class="today-flag">hoje</span>' : '') +
            '<span class="stamp">'+d.dia+'</span>' +
            '<button class="zoom-btn" aria-label="Ampliar imagem" data-action="zoom">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="leaf-face leaf-back">' +
            '<span class="region-tag ' + regionClass(d.regiao) + '">' + escapeHtml(d.regiao || '—') + '</span>' +
            '<p class="rua">'+escapeHtml(d.rua)+'</p>' +
            '<p class="cidade"><b>'+escapeHtml(d.cidade)+'</b>' + (d.uf ? ' — '+escapeHtml(d.uf) : '') + '</p>' +
            (d.nota ? '<p class="nota">'+escapeHtml(d.nota)+'</p>' : '') +
            '<div class="back-footer">' +
              '<span class="data-mono">'+escapeHtml(d.dataStr)+'</span>' +
              '<button class="ampliar" data-action="zoom">ampliar →</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderMonthSection(m){
    const items = DATA.filter(d => d.mes === m).sort((a,b) => a.dia - b.dia);
    const byDay = new Map(items.map(d => [d.dia, d]));
    const total = daysInMonth(m);
    const leadingBlanks = weekdayOf(1, m);

    let cells = '';
    for(let i = 0; i < leadingBlanks; i++){
      cells += '<div class="cal-empty"></div>';
    }
    for(let dia = 1; dia <= total; dia++){
      const d = byDay.get(dia);
      cells += d ? cardHTML(d) : '<div class="cal-blank">'+dia+'</div>';
    }

    return (
      '<section class="month-section" id="mes-'+m+'">' +
        '<h2 class="month-title">'+MESES[m]+' <small>'+items.length+' de '+total+' dias</small></h2>' +
        '<div class="weekday-row">' + DIAS_SEMANA.map(w => '<span>'+w+'</span>').join('') + '</div>' +
        '<div class="calendar">' + cells + '</div>' +
      '</section>'
    );
  }

  function renderGallery(){
    const present = Array.from(new Set(DATA.map(d => d.mes))).sort((a,b) => a - b);
    statusLine.textContent = DATA.length + ' predinhos, de ' + MESES[present[0]].toLowerCase() + ' a ' + MESES[present[present.length-1]].toLowerCase() + ' de ' + YEAR;
    main.innerHTML = present.map(renderMonthSection).join('');
    attachCardEvents();
  }

  function applySearchFilter(query){
    const q = query.trim().toLowerCase();
    if(q === ''){
      document.querySelectorAll('.search-hide').forEach(el => el.classList.remove('search-hide'));
      document.querySelectorAll('.month-section').forEach(el => el.classList.remove('search-hide'));
      const present = Array.from(new Set(DATA.map(d => d.mes))).sort((a,b) => a - b);
      statusLine.textContent = DATA.length + ' predinhos, de ' + MESES[present[0]].toLowerCase() + ' a ' + MESES[present[present.length-1]].toLowerCase() + ' de ' + YEAR;
      return;
    }
    let matches = 0;
    document.querySelectorAll('.month-section').forEach(section => {
      let sectionHasMatch = false;
      section.querySelectorAll('.leaf').forEach(leaf => {
        const isMatch = (leaf.dataset.search || '').includes(q);
        leaf.classList.toggle('search-hide', !isMatch);
        if(isMatch){ sectionHasMatch = true; matches++; }
      });
      section.querySelectorAll('.cal-blank').forEach(b => b.classList.add('search-hide'));
      section.querySelectorAll('.cal-empty').forEach(b => b.classList.add('search-hide'));
      section.classList.toggle('search-hide', !sectionHasMatch);
    });
    statusLine.textContent = matches + ' resultado(s) para "' + query + '"';
  }

  function attachCardEvents(){
    document.querySelectorAll('.leaf').forEach(leaf => {
      leaf.addEventListener('click', function(e){
        if(e.target.closest('[data-action="zoom"]')){
          e.stopPropagation();
          openLightboxFor(leaf);
          return;
        }
        leaf.classList.toggle('flipped');
      });
    });
  }

  function findEntry(dia, mes){
    return DATA.find(d => d.dia === dia && d.mes === mes);
  }

  function openLightboxFor(leafEl){
    const dia = parseInt(leafEl.dataset.dia,10);
    const mes = parseInt(leafEl.dataset.mes,10);
    const d = findEntry(dia, mes);
    if(!d) return;
    lightboxImg.src = imgUrl(d.img, 1400);
    lightboxImg.alt = 'Predinho de ' + d.rua;
    lightboxRua.textContent = d.rua;
    lightboxCidade.textContent = d.cidade + (d.uf ? ' — ' + d.uf : '') + (d.dataStr ? ' · ' + d.dataStr : '');
    lightboxNota.textContent = d.nota || '';
    lightbox.classList.add('open');
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  function showError(err){
    main.innerHTML =
      '<div class="error-state">' +
        '<p><strong>Não consegui carregar a planilha automaticamente.</strong></p>' +
        '<p>Confirme que ela está como "Qualquer pessoa com o link pode visualizar" e que esta página está sendo aberta via http/https (não abrindo o arquivo direto no navegador).</p>' +
        '<code>' + escapeHtml(String(err.message || err)) + '</code>' +
      '</div>';
    statusLine.textContent = '';
  }

  let searchDebounce;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    const val = this.value;
    searchDebounce = setTimeout(() => applySearchFilter(val), 150);
  });

  loadData();
})();
</script>
</body>
</html>
