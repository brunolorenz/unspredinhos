<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advinhe o signo do predinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #0a0e27;
    --mid: #141a42;
    --gold: #e6c27a;
    --gold-dim: #a68a55;
    --cream: #f4efe2;
    --violet: #756bb0;
    --correct: #6fbf8b;
    --wrong: #e2665a;
    --card: rgba(244,239,226,0.06);
    --card-line: rgba(230,194,122,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at 50% -10%, #1c2456 0%, var(--deep) 55%, #050712 100%);
    color: var(--cream);
    font-family:'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body{
    padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---------- starfield ---------- */
  #sky{
    position:fixed; inset:-6vmax; z-index:0; pointer-events:none; overflow:hidden;
    will-change: transform;
  }
  .sky-layer{ position:absolute; inset:0; }
  .star{
    position:absolute; border-radius:50%; background:var(--cream);
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }
  .constellation{position:absolute; opacity:.5; animation:constellation-glow 7s ease-in-out infinite;}
  .constellation line{stroke:var(--gold-dim); stroke-width:1; opacity:.55;}
  .constellation circle{fill:var(--gold);}
  @keyframes constellation-glow{
    0%,100%{opacity:.22;}
    50%{opacity:.6;}
  }

  /* ---------- layout ---------- */
  .wrap{
    position:relative; z-index:1; width:100%; max-width:560px;
    padding:32px 20px 48px; display:flex; flex-direction:column; align-items:center;
  }
  header{ text-align:center; margin-bottom:22px; }
  h1{
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    font-weight:700; margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0; color:var(--cream); opacity:.65;
    font-size:.95rem; line-height:1.5; max-width:38ch; margin:0 auto;
  }

  .status-row{
    display:flex; gap:10px; margin: 22px 0 6px; flex-wrap:wrap; justify-content:center;
  }
  .pill{
    background:var(--card); border:1px solid var(--card-line);
    border-radius:999px; padding:7px 16px; font-size:.85rem;
    display:flex; align-items:center; gap:6px;
  }
  .pill b{ color:var(--gold); font-weight:700; }
  .pill-btn{
    font-family:inherit; color:var(--cream); cursor:pointer;
    margin:0; -webkit-appearance:none; appearance:none;
    transition: border-color .15s ease, background .15s ease;
  }
  .pill-btn:hover{ border-color:var(--gold); background:rgba(230,194,122,0.1); }

  /* ---------- arena (predinho) ---------- */
  .arena{
    position:relative;
    width:min(78vw, 380px);
    aspect-ratio:1/1;
    margin: 18px 0 4px;
  }
  .predinho-glow{
    position:absolute; inset:-7%;
    border-radius:32px; z-index:0;
    background: radial-gradient(circle, rgba(230,194,122,0.55) 0%, rgba(230,194,122,0.26) 42%, rgba(230,194,122,0) 74%);
    filter: blur(10px);
    animation: glow-breathe 5s ease-in-out infinite;
  }
  @keyframes glow-breathe{
    0%,100%{ opacity:.75; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.04); }
  }
  .predinho-frame{
    position:absolute; inset:0; z-index:1;
    border-radius:24px;
    overflow:hidden; background:#1a1f45;
    box-shadow: 0 0 0 1px var(--card-line), 0 16px 34px rgba(0,0,0,.55);
    transition: box-shadow .3s ease;
  }
  .predinho-frame.state-correct{ box-shadow: 0 0 0 3px var(--correct); }
  .predinho-frame.state-wrong{ box-shadow: 0 0 0 3px var(--wrong); }
  .predinho-frame img{
    position:absolute; top:0; left:0;
    width:100%; height:117.65%;
    object-fit:cover; object-position: top center;
  }
  .predinho-frame .ph{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.75rem; color:var(--cream); opacity:.5; text-align:center; padding:10%;
  }

  .options-row{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    width:100%; max-width:460px; margin-top:22px;
  }
  .option-btn{
    flex:1 1 120px; max-width:150px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:16px 10px;
    border-radius:18px;
    border:1px solid var(--card-line);
    background: var(--card);
    color:var(--cream);
    font-family:inherit;
    cursor:pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .option-btn .sym{ font-size:1.9rem; color:var(--gold); line-height:1; }
  .option-btn .nm{ font-size:.85rem; font-weight:600; text-align:center; }
  .option-btn:hover{ background:rgba(230,194,122,0.14); border-color:var(--gold); }
  .option-btn:active{ transform:scale(.96); }
  .option-btn[disabled]{ cursor:default; }
  .option-btn.correct{ background:var(--correct); border-color:var(--correct); color:var(--deep); }
  .option-btn.correct .sym{ color:var(--deep); }
  .option-btn.wrong{ background:var(--wrong); border-color:var(--wrong); color:var(--cream); }
  .option-btn.wrong .sym{ color:var(--cream); }
  .option-btn.dim[disabled]{ opacity:.35; }

  .hint{
    margin-top:16px; font-size:.85rem; opacity:.55; text-align:center; min-height:1.2em;
  }

  /* ---------- modal overlay (feedback + placar) ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    display:none; align-items:center; justify-content:center;
    padding: max(20px, env(safe-area-inset-top,0px)) 20px max(20px, env(safe-area-inset-bottom,0px));
  }
  .modal-overlay.show{ display:flex; }
  .modal-backdrop{
    position:absolute; inset:0;
    background: rgba(6,8,24,0.62);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    opacity:0; transition: opacity .3s ease;
  }
  .modal-overlay.show .modal-backdrop{ opacity:1; }
  .modal-card{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    background: var(--mid);
    border:1px solid var(--card-line);
    border-radius:22px;
    overflow:hidden;
    box-shadow: 0 28px 70px rgba(0,0,0,.55);
    transform: translateY(16px) scale(.96); opacity:0;
    transition: transform .3s ease, opacity .3s ease;
    max-height: 90vh; display:flex; flex-direction:column;
  }
  .modal-overlay.show .modal-card{ transform:translateY(0) scale(1); opacity:1; }
  .modal-card .art{
    width:100%; height:min(48vh, 340px); flex-shrink:0;
    background:#05071a;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .modal-card .art img{ width:100%; height:100%; object-fit:contain; }
  .modal-card .body{
    padding:20px 22px 22px; display:flex; flex-direction:column; gap:10px;
    overflow-y:auto;
  }
  .modal-card h2{ margin:0; font-size:1.1rem; font-weight:700; }
  .modal-card .verdict{ font-weight:700; font-size:1.15rem; display:flex; align-items:center; gap:8px; }
  .modal-card .verdict.ok{ color:var(--correct); }
  .modal-card .verdict.no{ color:var(--wrong); }
  .modal-card .detail{ font-size:.92rem; line-height:1.55; opacity:.85; }
  .modal-card .detail b{ color:var(--gold); font-weight:600; }
  .modal-card button.primary{
    align-self:flex-start; margin-top:6px;
    background:var(--gold); color:var(--deep); border:none;
    font-family:inherit; font-weight:700; font-size:.9rem;
    padding:11px 22px; border-radius:999px; cursor:pointer;
  }
  .modal-card button.primary:active{ transform:scale(.97); }
  .modal-card button.secondary{
    align-self:flex-start; margin-top:2px;
    background:transparent; color:var(--gold-dim); border:1px solid var(--card-line);
    font-family:inherit; font-weight:600; font-size:.85rem;
    padding:10px 20px; border-radius:999px; cursor:pointer;
  }

  .save-streak{
    margin-top:6px; padding-top:14px; border-top:1px solid var(--card-line);
    display:flex; flex-direction:column; gap:8px;
  }
  .save-streak .row{ display:flex; gap:8px; }
  .save-streak input{
    flex:1; min-width:0;
    background:rgba(244,239,226,0.08); border:1px solid var(--card-line);
    border-radius:10px; padding:9px 12px; color:var(--cream);
    font-family:inherit; font-size:.88rem;
  }
  .save-streak input::placeholder{ color:rgba(244,239,226,0.4); }
  .save-streak button{
    background:var(--violet); color:var(--cream); border:none;
    border-radius:10px; padding:9px 16px; font-family:inherit;
    font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap;
  }
  .save-streak .save-msg{ font-size:.8rem; opacity:.7; }

  .lb-list{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:8px;
  }
  .lb-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:12px;
    background:rgba(244,239,226,0.04);
  }
  .lb-item .rank{ color:var(--gold-dim); font-weight:700; width:1.8em; flex-shrink:0; }
  .lb-item .name{ flex:1; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-item .streak{ color:var(--gold); font-weight:700; font-size:.92rem; }

  /* ---------- loading / error ---------- */
  .state-msg{
    text-align:center; opacity:.7; font-size:.9rem; margin-top:40px; line-height:1.6;
  }
  .state-msg.error{ color:var(--wrong); opacity:1; }
  .state-msg button{
    display:block; margin:16px auto 0;
    background:transparent; color:var(--gold); border:1px solid var(--gold-dim);
    font-family:inherit; font-weight:600; font-size:.85rem;
    padding:9px 18px; border-radius:999px; cursor:pointer;
  }

  .gyro-btn{
    position:fixed; z-index:5;
    top: calc(env(safe-area-inset-top,0px) + 14px); right:14px;
    background:var(--card); border:1px solid var(--card-line); color:var(--gold);
    font-family:inherit; font-size:.75rem; font-weight:600;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="sky"></div>
<button id="gyroBtn" class="gyro-btn hidden" type="button">Ativar movimento</button>

<div class="wrap">
  <header>
    <h1>Advinhe o signo do predinho</h1>
    <p>Cada predinho nasceu num dia do calendário — e todo dia tem um signo. Olhe pra fachada e tente adivinhar o dele.</p>
  </header>

  <div id="statusRow" class="status-row hidden">
    <div class="pill">Sequência <b id="streakLabel">0</b></div>
    <div class="pill">Recorde <b id="bestLabel">0</b></div>
    <button id="leaderboardBtn" class="pill pill-btn" type="button">Ver placar</button>
  </div>

  <div id="loadingMsg" class="state-msg">Carregando os predinhos do céu…</div>

  <div id="arena" class="arena hidden">
    <div class="predinho-glow" aria-hidden="true"></div>
    <div class="predinho-frame" id="predinhoFrame">
      <img id="predinhoImg" alt="">
    </div>
  </div>

  <div id="options" class="options-row"></div>

  <div id="hint" class="hint hidden">Toque no signo que você acha que é esse predinho</div>

  <div id="feedback" class="modal-overlay">
    <div class="modal-backdrop"></div>
    <div class="modal-card" id="feedbackCard"></div>
  </div>

  <div id="leaderboardOverlay" class="modal-overlay">
    <div class="modal-backdrop"></div>
    <div class="modal-card" id="leaderboardCard"></div>
  </div>
</div>

<script>
(function(){

  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJSnZh8lr-Jkgt4XUC63cu0Ml75_YiWK-Ltty_nlExm6tMUNQXMaI7htEbS1MJnAQbc_6huHlZD0Du/pub?gid=1029790880&single=true&output=csv";

  // Depois de publicar o Apps Script (veja instruções em separado), troque a linha
  // abaixo pela URL do deployment terminada em /exec.
  var LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbzLpQ-dJ2VIl8oLj8ToLOwoyxfoOvVsRJFOjn92UmGXlWjIioEORIy_i1MLnY88_XDb/exec";

  var SIGNS = [
    {id:'aries',       name:'Áries',       symbol:'♈'},
    {id:'touro',       name:'Touro',       symbol:'♉'},
    {id:'gemeos',      name:'Gêmeos',      symbol:'♊'},
    {id:'cancer',      name:'Câncer',      symbol:'♋'},
    {id:'leao',        name:'Leão',        symbol:'♌'},
    {id:'virgem',      name:'Virgem',      symbol:'♍'},
    {id:'libra',       name:'Libra',       symbol:'♎'},
    {id:'escorpiao',   name:'Escorpião',   symbol:'♏'},
    {id:'sagitario',   name:'Sagitário',   symbol:'♐'},
    {id:'capricornio', name:'Capricórnio', symbol:'♑'},
    {id:'aquario',     name:'Aquário',     symbol:'♒'},
    {id:'peixes',      name:'Peixes',      symbol:'♓'}
  ];
  var SIGN_BY_ID = {};
  SIGNS.forEach(function(s){ SIGN_BY_ID[s.id] = s; });

  var MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  function zodiacFor(month, day){
    var v = month*100 + day;
    if (v>=120 && v<=218) return 'aquario';
    if (v>=219 && v<=320) return 'peixes';
    if (v>=321 && v<=419) return 'aries';
    if (v>=420 && v<=520) return 'touro';
    if (v>=521 && v<=620) return 'gemeos';
    if (v>=621 && v<=722) return 'cancer';
    if (v>=723 && v<=822) return 'leao';
    if (v>=823 && v<=922) return 'virgem';
    if (v>=923 && v<=1022) return 'libra';
    if (v>=1023 && v<=1121) return 'escorpiao';
    if (v>=1122 && v<=1221) return 'sagitario';
    return 'capricornio';
  }

  // ---------- CSV parsing ----------
  function parseCSVLine(line){
    var out = [], cur = '', inQ = false;
    for (var i=0;i<line.length;i++){
      var c = line[i];
      if (c === '"'){
        if (inQ && line[i+1] === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ){
        out.push(cur); cur = '';
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out;
  }

  function parseCSV(text){
    var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){ return l.length > 0; });
    var rows = lines.map(parseCSVLine);
    var header = rows[0];
    return rows.slice(1).map(function(cols){
      var row = {};
      header.forEach(function(h, i){ row[h.trim()] = (cols[i] || '').trim(); });
      return row;
    });
  }

  function buildDeck(rows){
    var deck = [];
    rows.forEach(function(r){
      var dia = parseInt(r['Dia'], 10);
      var mes = parseInt(r['Mês'], 10);
      var img = r['URL Imagem'];
      var rua = r['Rua'];
      var cidade = r['Cidade'];
      var uf = r['UF'];
      if (!img || isNaN(dia) || isNaN(mes) || !rua || !cidade) return;
      deck.push({
        dia: dia, mes: mes, rua: rua, cidade: cidade, uf: uf,
        img: img, sign: zodiacFor(mes, dia)
      });
    });
    return deck;
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  // ---------- starfield ----------
  function buildSky(){
    var sky = document.getElementById('sky');
    var starsLayer = document.createElement('div');
    starsLayer.className = 'sky-layer layer-stars';
    var constLayer = document.createElement('div');
    constLayer.className = 'sky-layer layer-const';

    var frag = document.createDocumentFragment();
    for (var i=0;i<70;i++){
      var s = document.createElement('div');
      s.className = 'star';
      var size = (Math.random()*2 + 1).toFixed(1);
      s.style.width = size+'px';
      s.style.height = size+'px';
      s.style.left = (Math.random()*100)+'%';
      s.style.top = (Math.random()*100)+'%';
      s.style.animationDuration = (3.5 + Math.random()*4).toFixed(1)+'s';
      s.style.animationDelay = (Math.random()*5).toFixed(1)+'s';
      frag.appendChild(s);
    }
    starsLayer.appendChild(frag);
    sky.appendChild(starsLayer);

    var shapes = [
      {pts:[[8,14],[16,10],[24,18],[19,27]], vb:[0,0,34,34], top:'6%', left:'4%', w:'150px'},
      {pts:[[4,20],[14,6],[22,12],[30,4]],    vb:[0,0,34,26], top:'62%', left:'78%', w:'170px'},
      {pts:[[6,6],[18,16],[12,28],[2,22]],    vb:[0,0,26,32], top:'18%', left:'82%', w:'110px'},
      {pts:[[2,10],[12,2],[20,10],[16,22],[6,20]], vb:[0,0,24,26], top:'78%', left:'10%', w:'130px'}
    ];
    shapes.forEach(function(sh, idx){
      var svgns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgns, 'svg');
      svg.setAttribute('viewBox', sh.vb.join(' '));
      svg.classList.add('constellation');
      svg.style.top = sh.top; svg.style.left = sh.left; svg.style.width = sh.w;
      svg.style.animationDelay = (idx*1.3)+'s';
      for (var i=0;i<sh.pts.length-1;i++){
        var line = document.createElementNS(svgns, 'line');
        line.setAttribute('x1', sh.pts[i][0]); line.setAttribute('y1', sh.pts[i][1]);
        line.setAttribute('x2', sh.pts[i+1][0]); line.setAttribute('y2', sh.pts[i+1][1]);
        svg.appendChild(line);
      }
      sh.pts.forEach(function(p){
        var c = document.createElementNS(svgns, 'circle');
        c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 1.1);
        svg.appendChild(c);
      });
      constLayer.appendChild(svg);
    });
    sky.appendChild(constLayer);
  }

  // ---------- sky parallax (mouse / gyroscope) ----------
  function initParallax(){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var starsLayer = document.querySelector('.layer-stars');
    var constLayer = document.querySelector('.layer-const');
    if (!starsLayer || !constLayer) return;

    var target = {x:0, y:0};
    var current = {x:0, y:0};
    var MAX = 16;

    function setTarget(dx, dy){
      target.x = Math.max(-1, Math.min(1, dx));
      target.y = Math.max(-1, Math.min(1, dy));
    }

    function tick(){
      current.x += (target.x - current.x) * 0.06;
      current.y += (target.y - current.y) * 0.06;
      starsLayer.style.transform = 'translate(' + (current.x*MAX*0.4) + 'px,' + (current.y*MAX*0.4) + 'px)';
      constLayer.style.transform = 'translate(' + (current.x*MAX) + 'px,' + (current.y*MAX) + 'px)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener('mousemove', function(e){
      setTarget((e.clientX/window.innerWidth - 0.5)*2, (e.clientY/window.innerHeight - 0.5)*2);
    });

    function onOrientation(e){
      if (e.beta === null || e.gamma === null) return;
      setTarget(e.gamma/45, (e.beta-45)/45);
    }

    var DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function'){
      var btn = document.getElementById('gyroBtn');
      btn.classList.remove('hidden');
      btn.addEventListener('click', function(){
        DOE.requestPermission().then(function(state){
          if (state === 'granted'){
            window.addEventListener('deviceorientation', onOrientation);
          }
          btn.classList.add('hidden');
        }).catch(function(){ btn.classList.add('hidden'); });
      });
    } else if (DOE) {
      window.addEventListener('deviceorientation', onOrientation);
    }
  }

  // ---------- game state ----------
  var deck = [];
  var queue = [];
  var current = null;
  var streak = 0;
  var best = 0;
  var locked = false;
  var leaderboardConfigured = LEADERBOARD_URL.indexOf('COLOQUE_AQUI') === -1;

  var els = {
    loading: document.getElementById('loadingMsg'),
    statusRow: document.getElementById('statusRow'),
    streakLabel: document.getElementById('streakLabel'),
    bestLabel: document.getElementById('bestLabel'),
    leaderboardBtn: document.getElementById('leaderboardBtn'),
    arena: document.getElementById('arena'),
    frame: document.getElementById('predinhoFrame'),
    img: document.getElementById('predinhoImg'),
    hint: document.getElementById('hint'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    feedbackCard: document.getElementById('feedbackCard'),
    leaderboardOverlay: document.getElementById('leaderboardOverlay'),
    leaderboardCard: document.getElementById('leaderboardCard')
  };

  function pickOptionIds(correctId){
    var others = SIGNS.filter(function(s){ return s.id !== correctId; });
    var distractors = shuffle(others).slice(0, 2);
    var ids = distractors.map(function(s){ return s.id; }).concat([correctId]);
    return shuffle(ids);
  }

  function renderOptions(correctId){
    els.options.innerHTML = '';
    pickOptionIds(correctId).forEach(function(signId){
      var sign = SIGN_BY_ID[signId];
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.dataset.sign = sign.id;
      btn.innerHTML = '<span class="sym">' + sign.symbol + '</span><span class="nm">' + sign.name + '</span>';
      btn.addEventListener('click', function(){ onGuess(sign.id); });
      els.options.appendChild(btn);
    });
  }

  function nextPredinho(){
    if (queue.length === 0) queue = shuffle(deck);
    return queue.pop();
  }

  // ---------- placar compartilhado (Google Sheets via Apps Script) ----------
  function postScore(name, streakValue){
    return fetch(LEADERBOARD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: name, streak: streakValue })
    }).then(function(res){
      if (!res.ok) throw new Error('status ' + res.status);
      return res.json();
    });
  }

  function fetchLeaderboard(){
    return fetch(LEADERBOARD_URL + '?_=' + Date.now())
      .then(function(res){
        if (!res.ok) throw new Error('status ' + res.status);
        return res.json();
      });
  }

  function openLeaderboard(){
    els.leaderboardOverlay.classList.add('show');
    if (!leaderboardConfigured){
      els.leaderboardCard.innerHTML =
        '<div class="body">' +
          '<h2>Placar</h2>' +
          '<div class="detail">O placar compartilhado ainda não foi configurado — falta colar a URL do Apps Script no início do arquivo.</div>' +
          '<button class="secondary" id="lbCloseBtn">Fechar</button>' +
        '</div>';
      document.getElementById('lbCloseBtn').addEventListener('click', closeLeaderboard);
      return;
    }
    els.leaderboardCard.innerHTML =
      '<div class="body"><h2>Placar</h2><div class="detail">Carregando…</div></div>';
    fetchLeaderboard()
      .then(function(data){
        var entries = (data && data.leaderboard) || [];
        var list = entries.length
          ? '<ol class="lb-list">' + entries.map(function(e, i){
              return '<li class="lb-item"><span class="rank">' + (i+1) + '</span>' +
                '<span class="name">' + escapeHtml(e.name || 'Anônimo') + '</span>' +
                '<span class="streak">' + e.streak + '</span></li>';
            }).join('') + '</ol>'
          : '<div class="detail">Ninguém salvou uma sequência ainda — seja a primeira pessoa.</div>';
        els.leaderboardCard.innerHTML =
          '<div class="body"><h2>Placar</h2>' + list + '<button class="secondary" id="lbCloseBtn">Fechar</button></div>';
        document.getElementById('lbCloseBtn').addEventListener('click', closeLeaderboard);
      })
      .catch(function(err){
        els.leaderboardCard.innerHTML =
          '<div class="body"><h2>Placar</h2>' +
          '<div class="detail">Não consegui carregar o placar.<br><span style="opacity:.75">' +
          (err && err.message ? err.message : 'Erro desconhecido') + '</span></div>' +
          '<button class="secondary" id="lbCloseBtn">Fechar</button></div>';
        document.getElementById('lbCloseBtn').addEventListener('click', closeLeaderboard);
      });
  }

  function closeLeaderboard(){
    els.leaderboardOverlay.classList.remove('show');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  els.leaderboardBtn.addEventListener('click', openLeaderboard);

  function startGame(){
    streak = 0; best = 0; locked = false;
    queue = shuffle(deck);
    els.statusRow.classList.remove('hidden');
    els.arena.classList.remove('hidden');
    els.hint.classList.remove('hidden');
    showRound();
  }

  function showRound(){
    els.feedback.classList.remove('show');
    els.feedbackCard.innerHTML = '';
    els.hint.textContent = 'Toque no signo que você acha que é esse predinho';
    els.frame.classList.remove('state-correct','state-wrong');
    locked = false;

    current = nextPredinho();
    els.img.src = current.img;
    els.img.alt = 'Predinho de ' + current.dia + ' de ' + MONTHS[current.mes-1];
    els.streakLabel.textContent = streak;
    els.bestLabel.textContent = best;

    renderOptions(current.sign);
  }

  function onGuess(signId){
    if (locked) return;
    locked = true;
    var p = current;
    var isCorrect = signId === p.sign;
    var endedStreak = streak;

    if (isCorrect){
      streak++;
      if (streak > best) best = streak;
    } else {
      streak = 0;
    }

    document.querySelectorAll('.option-btn').forEach(function(b){
      b.disabled = true;
      if (b.dataset.sign === p.sign) b.classList.add('correct');
      else if (b.dataset.sign === signId) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    els.frame.classList.add(isCorrect ? 'state-correct' : 'state-wrong');
    els.hint.textContent = '';
    els.streakLabel.textContent = streak;
    els.bestLabel.textContent = best;

    var correctSign = SIGN_BY_ID[p.sign];
    var dateStr = p.dia + ' de ' + MONTHS[p.mes-1];
    var placeStr = p.rua + ' — ' + p.cidade + (p.uf ? ', ' + p.uf : '');

    var saveBlock = '';
    if (!isCorrect && endedStreak > 0 && leaderboardConfigured){
      saveBlock =
        '<div class="save-streak" id="saveStreak">' +
          '<div class="detail">Sua sequência foi de <b>' + endedStreak + '</b>. Salvar no placar?</div>' +
          '<div class="row">' +
            '<input type="text" id="saveNameInput" maxlength="24" placeholder="Seu nome">' +
            '<button id="saveStreakBtn" type="button">Salvar</button>' +
          '</div>' +
          '<div class="save-msg" id="saveMsg"></div>' +
        '</div>';
    }

    els.feedbackCard.innerHTML =
      '<div class="art"><img src="' + p.img + '" alt="Predinho de ' + dateStr + '"></div>' +
      '<div class="body">' +
        '<div class="verdict ' + (isCorrect ? 'ok' : 'no') + '">' +
          (isCorrect ? 'Acertou!' : 'Não foi dessa vez') +
        '</div>' +
        '<div class="detail">Esse predinho é de <b>' + correctSign.symbol + ' ' + correctSign.name + '</b>, ' +
          'pintado em <b>' + dateStr + '</b>, na <b>' + placeStr + '</b>.</div>' +
        saveBlock +
        '<button class="primary" id="nextBtn">Próximo predinho</button>' +
      '</div>';
    els.feedback.classList.add('show');

    var saveBtn = document.getElementById('saveStreakBtn');
    if (saveBtn){
      saveBtn.addEventListener('click', function(){
        var nameInput = document.getElementById('saveNameInput');
        var msg = document.getElementById('saveMsg');
        var name = (nameInput.value || 'Anônimo').trim().slice(0, 24) || 'Anônimo';
        saveBtn.disabled = true;
        nameInput.disabled = true;
        msg.textContent = 'Salvando…';
        postScore(name, endedStreak)
          .then(function(){ msg.textContent = 'Salvo no placar!'; })
          .catch(function(err){
            msg.textContent = 'Não consegui salvar (' + (err && err.message ? err.message : 'erro') + ').';
            saveBtn.disabled = false;
            nameInput.disabled = false;
          });
      });
    }

    document.getElementById('nextBtn').addEventListener('click', function(){
      els.feedback.classList.remove('show');
      showRound();
    });
  }

  // ---------- boot ----------
  buildSky();
  initParallax();

  fetch(CSV_URL + '&_=' + Date.now())
    .then(function(res){
      if (!res.ok) throw new Error('A planilha respondeu com status ' + res.status);
      return res.text();
    })
    .then(function(text){
      var rows = parseCSV(text);
      deck = buildDeck(rows);
      if (deck.length < 3) {
        throw new Error('A planilha só trouxe ' + deck.length + ' predinhos com imagem — não dá pra montar nem uma rodada.');
      }
      els.loading.classList.add('hidden');
      startGame();
    })
    .catch(function(err){
      els.loading.classList.add('error');
      els.loading.innerHTML = 'Não consegui carregar os predinhos da planilha.<br>' +
        '<span style="opacity:.75">' + (err && err.message ? err.message : 'Erro desconhecido') + '</span>';
      var retry = document.createElement('button');
      retry.textContent = 'Tentar de novo';
      retry.addEventListener('click', function(){ location.reload(); });
      els.loading.appendChild(retry);
    });

})();
</script>
</body>
</html>
